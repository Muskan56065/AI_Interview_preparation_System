
<!DOCTYPE html>
<html>
<head>
    <title>Candidate Profile</title>
</head>
<body>

<h2>Create Your Profile</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="full_name"
           placeholder="Full Name" required><br><br>

    <input type="text" name="phone"
           placeholder="Phone Number" required><br><br>

    <input type="text" name="education"
           placeholder="Education" required><br><br>

    <input type="number" name="experience"
           placeholder="Experience in Years" min="0" required><br><br>

    <textarea name="skills"
              placeholder="Enter your skills" required></textarea><br><br>

    <input type="text" name="target_role"
           placeholder="Target Job Role" required><br><br>

    <button type="submit">Save Profile</button>

</form>

</body>
</html>
