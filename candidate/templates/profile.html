
{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Candidate Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'profile.css' %}">
</head>

<body>

<div class="container">

    <h2>Create Your Profile</h2>
    <p class="subtitle">Tell us about yourself and your career goals</p>

    <form method="POST" id="candidateForm">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone"
                   placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label>Education</label>
            <input type="text" name="education"
                   placeholder="Enter your qualification" required>
        </div>

        <div class="form-group">
            <label>Experience (Years)</label>
            <input type="number" name="experience"
                   placeholder="Enter experience"
                   min="0" step="1" required>
        </div>

        <div class="form-group">
            <label>Technical Skills</label>
            <textarea name="skills"
                      placeholder="Example: Python, SQL, Django, HTML, CSS"
                      required></textarea>
        </div>

        <div class="form-group">
            <label>Target Job Role</label>
            <input type="text" name="target_role"
                   placeholder="Example: Python Developer" required>
        </div>

        <button type="submit" class="btn">Save Profile</button>

    </form>

</div>

<script src="{% static 'profile.js' %}"></script>

</body>
</html>
